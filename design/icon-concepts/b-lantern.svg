    <radialGradient id="light" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#FFF6D8"/><stop offset=".6" stop-color="#F4C978"/><stop offset="1" stop-color="#E8A33D"/></radialGradient>

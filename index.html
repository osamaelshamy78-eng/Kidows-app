<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عالم الأقواس للأطفال</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #87CEEB;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    
    .settings-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 28px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 50px;
      width: 100%;
      max-width: 400px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
      user-select: none;
    }

    .card:active {
      transform: scale(0.95);
    }

    .card span {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- زر الإعدادات / بوابة الوالدين -->
  <button class="settings-btn" onclick="openParentGate()">⚙️</button>

  <!-- كروت التفاعل للأطفال -->
  <div class="cards-container">
    <div class="card" onclick="playSound('kaaba')">
      <svg width="60" height="60" viewBox="0 0 100 100">
        <rect x="20" y="20" width="60" height="60" fill="#222" />
        <rect x="20" y="35" width="60" height="10" fill="#FFD700" />
      </svg>
      <span>الكعبة</span>
    </div>

    <div class="card" onclick="playSound('bee')">
      <svg width="60" height="60" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="30" fill="#FFC107" />
        <line x1="30" y1="40" x2="70" y2="40" stroke="#000" stroke-width="4" />
        <line x1="30" y1="60" x2="70" y2="60" stroke="#000" stroke-width="4" />
      </svg>
      <span>النحلة</span>
    </div>

    <div class="card" onclick="playSound('rain')">
      <svg width="60" height="60" viewBox="0 0 100 100">
        <path d="M 20 50 Q 35 20 50 50 Q 65 20 80 50 Z" fill="#03A9F4" />
      </svg>
      <span>المطر</span>
    </div>

    <div class="card" onclick="playSound('moon')">
      <svg width="60" height="60" viewBox="0 0 100 100">
        <path d="M 50 20 A 30 30 0 1 0 80 50 A 25 25 0 1 1 50 20 Z" fill="#FFEB3B" />
      </svg>
      <span>القمر</span>
    </div>
  </div>

  <!-- نافذة بوابة الوالدين -->
  <div id="parentGateModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#fff; padding:20px; border-radius:15px; text-align:center; max-width:300px; width:80%;">
      <h3>منطقة الوالدين 🔒</h3>
      <p id="gateQuestion" style="font-size:18px; margin:15px 0;"></p>
      <input type="number" id="gateAnswer" style="font-size:18px; width:80px; text-align:center; padding:5px; margin-bottom:15px;">
      <br>
      <button onclick="checkParentGate()" style="padding:8px 20px; font-size:16px; background:#4CAF50; color:#fff; border:none; border-radius:5px;">تأكيد</button>
      <button onclick="closeParentGate()" style="padding:8px 20px; font-size:16px; background:#f44336; color:#fff; border:none; border-radius:5px; margin-right:5px;">إلغاء</button>
    </div>
  </div>

  <script>
    // تهيئة مكتبة الأصوات المباشرة
    const soundPaths = {
      kaaba: 'takbeer.wav',
      bee: 'bee.wav',
      rain: 'rain.wav',
      moon: 'birds.wav'
    };

    const audioFiles = {};
    let isAudioUnlocked = false;

    // تحميل وتجهيز عناصر الصوت مسبقاً
    Object.keys(soundPaths).forEach(key => {
      const audio = new Audio(soundPaths[key]);
      audio.preload = 'auto';
      audioFiles[key] = audio;
    });

    // دالة لفك حظر الصوت المترتب على سياسات المتصفح عند أول لمسة
    function unlockAudio() {
      if (isAudioUnlocked) return;
      Object.keys(audioFiles).forEach(key => {
        const audio = audioFiles[key];
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
        }).catch(() => {});
      });
      isAudioUnlocked = true;
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('click', unlockAudio);
    }

    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    // دالة تشغيل الصوت
    function playSound(key) {
      const audio = audioFiles[key];
      if (audio) {
        audio.currentTime = 0;
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.error('Audio playback error:', error);
          });
        }
      }
    }

    // منطق بوابة الوالدين
    let num1, num2, correctAnswer;

    function openParentGate() {
      num1 = Math.floor(Math.random() * 10) + 1;
      num2 = Math.floor(Math.random() * 10) + 1;
      correctAnswer = num1 + num2;
      
      document.getElementById('gateQuestion').innerText = `كم حاصل: ${num1} + ${num2} ؟`;
      document.getElementById('gateAnswer').value = '';
      document.getElementById('parentGateModal').style.display = 'flex';
    }

    function checkParentGate() {
      const userAnswer = parseInt(document.getElementById('gateAnswer').value);
      if (userAnswer === correctAnswer) {
        alert('تم التحقق بنجاح!');
        closeParentGate();
      } else {
        alert('إجابة خاطئة، حاول مرة أخرى.');
        openParentGate();
      }
    }

    function closeParentGate() {
      document.getElementById('parentGateModal').style.display = 'none';
    }

    // تسجيل الـ Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.log('Service Worker Failed', err));
    }
  </script>
</body>
</html>
